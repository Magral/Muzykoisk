name: Signed Android release
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command-line tools and SDK
        run: |
          set -e
          export ANDROID_HOME="$HOME/android-sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --location --retry 3 --output /tmp/android-cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/android-cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Read app version
        id: app_version
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION_NAME"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
      - name: Verify signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.MUZYKOISK_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MUZYKOISK_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MUZYKOISK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MUZYKOISK_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo "Missing signing secrets"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/muzykoisk-release.jks"
      - name: Build signed APK
        env:
          MUZYKOISK_KEYSTORE_PATH: ${{ runner.temp }}/muzykoisk-release.jks
          MUZYKOISK_STORE_PASSWORD: ${{ secrets.MUZYKOISK_STORE_PASSWORD }}
          MUZYKOISK_KEY_ALIAS: ${{ secrets.MUZYKOISK_KEY_ALIAS }}
          MUZYKOISK_KEY_PASSWORD: ${{ secrets.MUZYKOISK_KEY_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease --stacktrace
      - name: Report failed build to GitHub issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Muzykoisk release CI failed: ${GITHUB_SHA:0:7}" --body "Signed release workflow failed. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Review the failed step logs. No signing secrets are included." || true
      - name: Verify signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Muzykoisk-v${{ steps.app_version.outputs.name }}-signed
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.app_version.outputs.name }}
        run: |
          TAG="v$VERSION_NAME"
          gh release create "$TAG" app/build/outputs/apk/release/app-release.apk --title "Музыкоиск $TAG" --notes "Обновление: загрузка разрешённых MP3 файлов из приложения, проверка опубликованной лицензии и экран состояния загрузок." --target "$GITHUB_SHA"
